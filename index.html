<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Watch Log</title>
    
    <link rel="manifest" id="my-manifest" href="manifest.json">
    <meta name="theme-color" content="#120e1f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WatchLog">
    
    <link rel="icon" id="dynamic-favicon" type="image/png" href="">
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <script>
        (function generatePremiumCinemaIcon() {
            function createCinemaIcon(size) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const s = size / 512;

                ctx.save();
                ctx.scale(s, s);

                const bgGrad = ctx.createRadialGradient(256, 200, 30, 256, 256, 360);
                bgGrad.addColorStop(0, '#2a1f4a');
                bgGrad.addColorStop(0.6, '#130f24');
                bgGrad.addColorStop(1, '#07050f');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 512, 512);

                const glowGrad = ctx.createRadialGradient(256, 265, 10, 256, 265, 180);
                glowGrad.addColorStop(0, 'rgba(176, 149, 246, 0.35)');
                glowGrad.addColorStop(1, 'rgba(176, 149, 246, 0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(256, 265, 180, 0, Math.PI * 2);
                ctx.fill();

                function drawReel(cx, cy, radius) {
                    ctx.save();
                    ctx.shadowColor = 'rgba(176, 149, 246, 0.6)';
                    ctx.shadowBlur = 15;
                    
                    const reelGrad = ctx.createLinearGradient(cx - radius, cy - radius, cx + radius, cy + radius);
                    reelGrad.addColorStop(0, '#d4c2ff');
                    reelGrad.addColorStop(1, '#7b5cd6');
                    
                    ctx.fillStyle = reelGrad;
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#130f24';
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius * 0.32, 0, Math.PI * 2);
                    ctx.fill();

                    for (let i = 0; i < 4; i++) {
                        const angle = (i * Math.PI) / 2 + Math.PI / 4;
                        const hx = cx + Math.cos(angle) * (radius * 0.64);
                        const hy = cy + Math.sin(angle) * (radius * 0.64);
                        ctx.beginPath();
                        ctx.arc(hx, hy, radius * 0.17, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                drawReel(188, 165, 48);
                drawReel(324, 165, 48);

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                ctx.shadowBlur = 28;
                ctx.shadowOffsetY = 12;

                const bodyGrad = ctx.createLinearGradient(126, 215, 386, 375);
                bodyGrad.addColorStop(0, '#251e3e');
                bodyGrad.addColorStop(1, '#120e21');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(126, 215, 260, 155, 36);
                ctx.fill();

                ctx.shadowColor = '#b095f6';
                ctx.shadowBlur = 18;
                ctx.shadowOffsetY = 0;
                const borderGrad = ctx.createLinearGradient(126, 215, 386, 370);
                borderGrad.addColorStop(0, '#e2d4ff');
                borderGrad.addColorStop(0.5, '#b095f6');
                borderGrad.addColorStop(1, '#6a49c4');
                ctx.strokeStyle = borderGrad;
                ctx.lineWidth = 10;
                ctx.stroke();
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.roundRect(131, 220, 250, 32, [30, 30, 0, 0]);
                ctx.clip();

                ctx.fillStyle = 'rgba(176, 149, 246, 0.15)';
                ctx.fillRect(131, 220, 250, 32);

                ctx.fillStyle = '#b095f6';
                for (let x = 115; x < 390; x += 45) {
                    ctx.beginPath();
                    ctx.moveTo(x, 252);
                    ctx.lineTo(x + 20, 220);
                    ctx.lineTo(x + 38, 220);
                    ctx.lineTo(x + 18, 252);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();

                ctx.strokeStyle = 'rgba(176, 149, 246, 0.4)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(131, 252);
                ctx.lineTo(381, 252);
                ctx.stroke();

                ctx.save();
                ctx.shadowColor = 'rgba(255, 215, 0, 0.65)';
                ctx.shadowBlur = 22;

                const playGrad = ctx.createLinearGradient(225, 270, 295, 345);
                playGrad.addColorStop(0, '#ffffff');
                playGrad.addColorStop(0.4, '#ffe57f');
                playGrad.addColorStop(1, '#ffab00');

                ctx.fillStyle = playGrad;
                ctx.strokeStyle = playGrad;
                ctx.lineJoin = 'round';
                ctx.lineWidth = 12;

                ctx.beginPath();
                ctx.moveTo(234, 278);
                ctx.lineTo(234, 338);
                ctx.lineTo(288, 308);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.restore();
                return canvas.toDataURL('image/png');
            }

            window.addEventListener('DOMContentLoaded', () => {
                const icon192 = createCinemaIcon(192);
                const icon512 = createCinemaIcon(512);

                document.getElementById('dynamic-favicon').href = icon192;
                document.getElementById('dynamic-apple-icon').href = icon512;

                const dynamicManifest = {
                    "id": "/watchlog-pwa-v3",
                    "name": "My Watch Log",
                    "short_name": "WatchLog",
                    "description": "الأرشيف الشخصي للأفلام والمسلسلات والأنمي",
                    "start_url": window.location.origin + window.location.pathname,
                    "scope": window.location.origin + "/",
                    "display": "standalone",
                    "background_color": "#0a0a0a",
                    "theme_color": "#120e1f",
                    "orientation": "portrait-primary",
                    "icons": [
                        { "src": icon192, "sizes": "192x192", "type": "image/png", "purpose": "any" },
                        { "src": icon512, "sizes": "512x512", "type": "image/png", "purpose": "any" },
                        { "src": icon512, "sizes": "512x512", "type": "image/png", "purpose": "maskable" }
                    ]
                };
                const blob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/json' });
                document.getElementById('my-manifest').href = URL.createObjectURL(blob);

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
                }
            });
        })();
    </script>
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="data-actions-bar">
                <button id="cloud-sync-btn" onclick="setupCloudSync()" class="action-header-btn cloud-btn" title="ربط اللاب والموبايل ببعض لحظياً بدون ملفات">
                    ☁️ <span id="cloud-status-text">ربط السحابة (مزامنة لحظية)</span>
                </button>
                <button id="install-app-btn" class="action-header-btn install-btn" style="display: none;" title="تثبيت التطبيق على جهازك">
                    📲 تثبيت كـ App
                </button>
                <button onclick="exportFullDataJSON()" class="action-header-btn save-json-btn" title="نسخة احتياطية كملف JSON">
                    💾 حفظ JSON
                </button>
                <button onclick="document.getElementById('import-json-input').click()" class="action-header-btn import-btn" title="رفع ملف data.json">
                    📂 استيراد JSON
                </button>
                <input type="file" id="import-json-input" accept=".json" style="display: none;" onchange="importDataJSON(event)">
                <button onclick="restoreHiddenItems()" class="action-header-btn restore-btn" title="إظهار أي أعمال اختفت بسبب الحذف">
                    🔄 استرجاع المختفي
                </button>
            </div>

            <button id="fav-btn" class="fav-header-btn" title="الأعمال المفضلة (تقييم 9 و 10)">
                <svg viewBox="0 0 24 24" class="heart-icon">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span class="btn-label">المفضلة (Top)</span>
                <span id="fav-count-badge" class="btn-count">0</span>
            </button>
        </div>

        <div class="logo-container">
            <svg class="main-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#251e3e"/>
                        <stop offset="100%" stop-color="#0d0a18"/>
                    </linearGradient>
                    <linearGradient id="lavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#e2d4ff"/>
                        <stop offset="50%" stop-color="#b095f6"/>
                        <stop offset="100%" stop-color="#7b5cd6"/>
                    </linearGradient>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="50%" stop-color="#ffe57f"/>
                        <stop offset="100%" stop-color="#ffab00"/>
                    </linearGradient>
                </defs>
                <rect width="92" height="92" x="4" y="4" rx="22" fill="url(#bgGrad)" stroke="url(#lavGrad)" stroke-width="4"/>
                <circle cx="34" cy="27" r="11" fill="url(#lavGrad)"/>
                <circle cx="34" cy="27" r="4" fill="#130f24"/>
                <circle cx="66" cy="27" r="11" fill="url(#lavGrad)"/>
                <circle cx="66" cy="27" r="4" fill="#130f24"/>
                <rect x="20" y="42" width="60" height="38" rx="9" fill="#120e21" stroke="url(#lavGrad)" stroke-width="3.5"/>
                <line x1="20" y1="51" x2="80" y2="51" stroke="#b095f6" stroke-width="2" stroke-opacity="0.5"/>
                <polygon points="43,56 43,72 60,64" fill="url(#goldGrad)"/>
            </svg>
            <h1>My Watch Log</h1>
        </div>
        <p>الأرشيف الشخصي للأفلام والمسلسلات والأنمي</p>
    </header>

    <!-- الأقسام الرئيسية -->
    <nav id="main-nav">
        <button class="filter-btn active" data-filter="arabic_series_2026"><span class="btn-label">مسلسلات عربي</span></button>
        <button class="filter-btn" data-filter="arabic_movies_2026"><span class="btn-label">أفلام عربي</span></button>
        <button class="filter-btn" data-filter="english_movies_2026"><span class="btn-label">أفلام أجنبي</span></button>
        <button class="filter-btn" data-filter="english_series"><span class="btn-label">مسلسلات أجنبي</span></button>
        <button class="filter-btn" data-filter="anime"><span class="btn-label">أنمي</span></button>
        <button class="filter-btn" data-filter="cinema"><span class="btn-label">🎟️ سينما</span></button>
    </nav>

    <!-- القسم الفرعي (للمسلسلات الأجنبي والأنمي) -->
    <div id="sub-nav" class="sub-nav" style="display: none;">
        <button id="sub-btn-completed" class="sub-filter-btn active" data-subfilter="completed"></button>
        <button id="sub-btn-dropped" class="sub-filter-btn" data-subfilter="dropped"></button>
    </div>

    <!-- لوحة إضافة عمل جديد -->
    <div id="add-form-container" class="add-new-form">
        <h3>➕ إضافة عمل جديد لقسم: <span id="current-category-name" style="color: var(--lavender-accent);">مسلسلات عربي</span></h3>
        <div class="form-group">
            <input type="text" id="new-item-name" placeholder="اسم العمل (فيلم/مسلسل/أنمي)" required>
            
            <select id="cinema-lang-select" style="display: none;">
                <option value="en">فيلم أجنبي 🌍</option>
                <option value="ar">فيلم عربي 🇪🇬</option>
            </select>

            <select id="new-item-status">
                <option value="completed">اكتمل المشاهدة (✓)</option>
                <option value="dropped">لم يكتمل (✗)</option>
            </select>
            <input type="text" id="new-item-stopped" placeholder="وقفت فين؟ (مثال: الموسم التاني)" style="display:none;">
            <input type="number" id="new-item-rating" min="0" max="10" step="0.5" placeholder="تقييمك (من 10)">
            <button onclick="addNewItem()">إضافة وبحث تلقائي 🔍</button>
        </div>
    </div>

    <!-- شريط الدوائر التفاعلية للبحث والفلترة (بدون بوردر مربع) -->
    <div class="circle-tools-wrapper">
        <div class="circle-tools-row">
            <!-- دائرة البحث -->
            <button type="button" id="circle-search-btn" class="circle-tool-btn" onclick="toggleSearchInput()" title="بحث بالاسم">
                <span class="circle-icon">🔍</span>
                <span class="circle-label">بحث</span>
            </button>

            <!-- دائرة التقييمات -->
            <div class="circle-select-wrapper" id="rating-circle-wrap" title="فلترة بالتقييم">
                <div class="circle-tool-btn">
                    <span class="circle-icon">⭐</span>
                    <span class="circle-label" id="rating-circle-label">التقييم</span>
                </div>
                <select id="filter-rating-select" onchange="onCircleFilterChange()">
                    <option value="all">كل التقييمات</option>
                    <option value="10">⭐ 10 / 10</option>
                    <option value="9">⭐ 9 / 10</option>
                    <option value="8">⭐ 8 / 10</option>
                    <option value="7">⭐ 7 / 10</option>
                    <option value="6">⭐ 6 / 10</option>
                    <option value="5">⭐ 5 / 10</option>
                    <option value="4">⭐ 4 / 10</option>
                    <option value="3">⭐ 3 / 10</option>
                    <option value="2">⭐ 2 / 10</option>
                    <option value="1">⭐ 1 / 10</option>
                    <option value="unrated">لم يقيم</option>
                </select>
            </div>

            <!-- دائرة السنوات -->
            <div class="circle-select-wrapper" id="year-circle-wrap" title="فلترة بالسنة">
                <div class="circle-tool-btn">
                    <span class="circle-icon">📅</span>
                    <span class="circle-label" id="year-circle-label">السنة</span>
                </div>
                <select id="filter-year-select" onchange="onCircleFilterChange()">
                    <option value="all">كل السنوات</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2021">2021</option>
                    <option value="2020">2020</option>
                    <option value="2019">2019</option>
                    <option value="2018">2018</option>
                    <option value="2017">2017</option>
                    <option value="2016">2016</option>
                    <option value="2015">2015</option>
                    <option value="2014">2014</option>
                    <option value="2013">2013</option>
                    <option value="2012">2012</option>
                </select>
            </div>

            <!-- دائرة إعادة الضبط (الكل) -->
            <button type="button" class="circle-tool-btn reset-circle-btn" onclick="resetAllCircleFilters()" title="إظهار الكل">
                <span class="circle-icon">🔄</span>
                <span class="circle-label">الكل</span>
            </button>
        </div>

        <!-- خانة كتابة البحث (تظهر بنعومة عند الضغط على دائرة البحث فقط) -->
        <div id="expandable-search-bar" class="expandable-search-bar" style="display: none;">
            <input type="text" id="search-input" placeholder="اكتب اسم العمل للبحث الفوري..." oninput="onCircleFilterChange()">
            <button type="button" class="close-search-btn" onclick="clearAndCloseSearch()">✖</button>
        </div>
    </div>

    <!-- شريط عرض إجمالي العدد في القسم الحالي -->
    <div class="section-stats-wrapper">
        <div id="section-counter-banner" class="section-counter-banner">
            <span id="banner-title">إجمالي مسلسلات عربي:</span>
            <span id="banner-count" class="count-number">0</span>
        </div>
    </div>

    <main id="app-container">
        <!-- الكروت هتتعرض هنا -->
    </main>

    <script src="script.js"></script>
</body>
</html>
