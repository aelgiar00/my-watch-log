<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watch Log</title>
    <!-- لوجو التاب (Favicon) المرسوم باللافندر والأسود -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231a1a24' stroke='%23b095f6' stroke-width='6'/><circle cx='32' cy='32' r='10' fill='%23b095f6'/><circle cx='68' cy='32' r='10' fill='%23b095f6'/><path d='M25 58 Q50 82 75 58' stroke='%23b095f6' stroke-width='7' fill='none' stroke-linecap='round'/><polygon points='44,42 44,58 60,50' fill='%23ffffff'/></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo-container">
            <svg class="main-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#1a1a24" stroke="#b095f6" stroke-width="5"/>
                <circle cx="32" cy="30" r="9" fill="#b095f6"/>
                <circle cx="68" cy="30" r="9" fill="#b095f6"/>
                <rect x="22" y="45" width="56" height="34" rx="8" fill="#0a0a0a" stroke="#b095f6" stroke-width="4"/>
                <polygon points="43,53 43,71 61,62" fill="#b095f6"/>
            </svg>
            <h1>My Watch Log</h1>
        </div>
        <p>الأرشيف الشخصي للأفلام والمسلسلات والأنمي</p>
    </header>

    <!-- الأقسام الرئيسية -->
    <nav id="main-nav">
        <button class="filter-btn active" data-filter="arabic_series_2026">مسلسلات عربي</button>
        <button class="filter-btn" data-filter="arabic_movies_2026">أفلام عربي 2026</button>
        <button class="filter-btn" data-filter="english_movies_2026">أفلام أجنبي 2026</button>
        <button class="filter-btn" data-filter="english_series">مسلسلات أجنبي</button>
        <button class="filter-btn" data-filter="anime">أنمي</button>
        <button class="filter-btn" data-filter="cinema">🎟️ سينما</button>
    </nav>

    <!-- القسم الفرعي للأنمي -->
    <div id="anime-sub-nav" class="sub-nav" style="display: none;">
        <button class="sub-filter-btn active" data-subfilter="completed">✅ أنميات كملتها</button>
        <button class="sub-filter-btn" data-subfilter="dropped">❌ أنميات وقفتها / ما شوفتهاش</button>
    </div>

    <!-- لوحة إضافة عمل جديد -->
    <div class="add-new-form">
        <h3>➕ إضافة عمل جديد لقسم: <span id="current-category-name" style="color: var(--lavender-accent);">مسلسلات عربي</span></h3>
        <div class="form-group">
            <input type="text" id="new-item-name" placeholder="اسم العمل (فيلم/مسلسل/أنمي)" required>
            
            <select id="cinema-lang-select" style="display: none;">
                <option value="en">فيلم أجنبي 🌍</option>
                <option value="ar">فيلم عربي 🇪🇬</option>
            </select>

            <select id="new-item-status">
                <option value="completed">اكتمل المشاهدة (✓)</option>
                <option value="dropped">لم يكتمل (✗)</option>
            </select>
            <input type="text" id="new-item-stopped" placeholder="وقفت فين؟ (مثال: الموسم التاني)" style="display:none;">
            <input type="number" id="new-item-rating" min="0" max="10" step="0.5" placeholder="تقييمك (من 10)">
            <button onclick="addNewItem()">إضافة وبحث تلقائي 🔍</button>
        </div>
    </div>

    <main id="app-container">
        <!-- الكروت هتتعرض هنا -->
    </main>

    <script src="script.js"></script>
</body>
</html>
