<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watch Log 🍿</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Playfair Display للأسماء و Arial Bold للنصوص -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>My Watch Log 🍿</h1>
        <p>الأرشيف الشخصي للأفلام والمسلسلات والأنمي</p>
    </header>

    <nav>
        <button class="filter-btn active" data-filter="all">الكل</button>
        <button class="filter-btn" data-filter="arabic_series_2026">مسلسلات عربي 2026</button>
        <button class="filter-btn" data-filter="movies_2026">أفلام 2026 (عربي/أجنبي)</button>
        <button class="filter-btn" data-filter="english_series">مسلسلات أجنبي</button>
        <button class="filter-btn" data-filter="anime">أنمي</button>
    </nav>

    <main id="app-container">
        <!-- الكروت هتتعرض هنا بالـ JavaScript -->
    </main>

    <script src="script.js"></script>
</body>
</html>
