<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Watch Log</title>
    
    <!-- إعدادات تحويل الموقع إلى تطبيق موبايل مستقل (PWA) -->
    <link rel="manifest" id="my-manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WatchLog">
    
    <!-- أيقونة واضحة جداً للتاب والموبايل (بتتحدث تلقائياً لـ PNG عالية الجودة) -->
    <link rel="icon" id="dynamic-favicon" type="image/png" href="">
    <link rel="apple-touch-icon" id="dynamic-apple-icon" href="">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <!-- سكريبت توليد أيقونة PNG احترافية وواضحة جداً + تفعيل الـ App الحقيقي -->
    <script>
        (function generateClearAppIcons() {
            function createIcon(size) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // خلفية داكنة فخمة بحواف دائرية
                const grad = ctx.createLinearGradient(0, 0, size, size);
                grad.addColorStop(0, '#1e1b2e');
                grad.addColorStop(1, '#0a0a0f');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(0, 0, size, size, size * 0.22);
                ctx.fill();

                // إطار لافندر مضيء وواضح
                ctx.strokeStyle = '#b095f6';
                ctx.lineWidth = size * 0.05;
                ctx.stroke();

                // دائرة سينما خلفية خفيفة
                ctx.fillStyle = 'rgba(176, 149, 246, 0.15)';
                ctx.beginPath();
                ctx.arc(size / 2, size * 0.44, size * 0.26, 0, Math.PI * 2);
                ctx.fill();

                // علامة Play كبيرة وواضحة جداً في المنتصف باللون اللافندر والأبيض
                ctx.shadowColor = '#b095f6';
                ctx.shadowBlur = size * 0.06;
                ctx.fillStyle = '#b095f6';
                ctx.beginPath();
                ctx.moveTo(size * 0.38, size * 0.26);
                ctx.lineTo(size * 0.38, size * 0.62);
                ctx.lineTo(size * 0.70, size * 0.44);
                ctx.closePath();
                ctx.fill();

                // قلب صغير أحمر أو نجمة ذهبية فوق
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffd700';
                ctx.font = `900 ${size * 0.16}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText('★ WL', size / 2, size * 0.85);

                return canvas.toDataURL('image/png');
            }

            window.addEventListener('DOMContentLoaded', () => {
                const icon192 = createIcon(192);
                const icon512 = createIcon(512);

                document.getElementById('dynamic-favicon').href = icon192;
                document.getElementById('dynamic-apple-icon').href = icon512;

                // ربط الأيقونات الـ PNG بالـ Manifest عشان ينزل كـ App رسمي بدون علامة كروم
                const dynamicManifest = {
                    "id": "/watchlog-pwa",
                    "name": "My Watch Log",
                    "short_name": "WatchLog",
                    "description": "الأرشيف الشخصي للأفلام والمسلسلات والأنمي",
                    "start_url": window.location.origin + window.location.pathname,
                    "scope": window.location.origin + "/",
                    "display": "standalone",
                    "background_color": "#0a0a0a",
                    "theme_color": "#1a1a24",
                    "orientation": "portrait-primary",
                    "icons": [
                        { "src": icon192, "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
                        { "src": icon512, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
                    ]
                };
                const blob = new Blob([JSON.stringify(dynamicManifest)], { type: 'application/json' });
                document.getElementById('my-manifest').href = URL.createObjectURL(blob);

                // تسجيل الـ Service Worker الإجباري لتحويله من Shortcut إلى App
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
                }
            });
        })();
    </script>
</head>
<body>
    <header>
        <!-- الشريط العلوي للأدوات والمفضلة -->
        <div class="top-bar">
            <div class="data-actions-bar">
                <button id="install-app-btn" class="action-header-btn install-btn" style="display: none;" title="تثبيت التطبيق على جهازك">
                    📲 تثبيت كـ App رسمي
                </button>
                <button onclick="exportFullDataJSON()" class="action-header-btn save-json-btn" title="تحميل ملف data.json بكل تعديلاتك">
                    💾 حفظ JSON
                </button>
                <button onclick="document.getElementById('import-json-input').click()" class="action-header-btn import-btn" title="رفع ملف data.json لمزامنة التعديلات على هذا الجهاز">
                    📂 استيراد JSON
                </button>
                <input type="file" id="import-json-input" accept=".json" style="display: none;" onchange="importDataJSON(event)">
                <button onclick="restoreHiddenItems()" class="action-header-btn restore-btn" title="إظهار أي أعمال اختفت بسبب الحذف">
                    🔄 استرجاع المختفي
                </button>
            </div>

            <button id="fav-btn" class="fav-header-btn" title="الأعمال المفضلة (تقييم 9 و 10)">
                <svg viewBox="0 0 24 24" class="heart-icon">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span class="btn-label">المفضلة (Top)</span>
                <span id="fav-count-badge" class="btn-count">0</span>
            </button>
        </div>

        <!-- لوجو الهيدر الجديد الواضح جداً -->
        <div class="logo-container">
            <div class="clear-logo-badge">
                <span class="play-triangle">▶</span>
                <span class="wl-text">WL</span>
            </div>
            <h1>My Watch Log</h1>
        </div>
        <p>الأرشيف الشخصي للأفلام والمسلسلات والأنمي</p>
    </header>

    <!-- الأقسام الرئيسية -->
    <nav id="main-nav">
        <button class="filter-btn active" data-filter="arabic_series_2026"><span class="btn-label">مسلسلات عربي</span></button>
        <button class="filter-btn" data-filter="arabic_movies_2026"><span class="btn-label">أفلام عربي</span></button>
        <button class="filter-btn" data-filter="english_movies_2026"><span class="btn-label">أفلام أجنبي</span></button>
        <button class="filter-btn" data-filter="english_series"><span class="btn-label">مسلسلات أجنبي</span></button>
        <button class="filter-btn" data-filter="anime"><span class="btn-label">أنمي</span></button>
        <button class="filter-btn" data-filter="cinema"><span class="btn-label">🎟️ سينما</span></button>
    </nav>

    <!-- القسم الفرعي (للمسلسلات الأجنبي والأنمي) -->
    <div id="sub-nav" class="sub-nav" style="display: none;">
        <button id="sub-btn-completed" class="sub-filter-btn active" data-subfilter="completed"></button>
        <button id="sub-btn-dropped" class="sub-filter-btn" data-subfilter="dropped"></button>
    </div>

    <!-- لوحة إضافة عمل جديد -->
    <div id="add-form-container" class="add-new-form">
        <h3>➕ إضافة عمل جديد لقسم: <span id="current-category-name" style="color: var(--lavender-accent);">مسلسلات عربي</span></h3>
        <div class="form-group">
            <input type="text" id="new-item-name" placeholder="اسم العمل (فيلم/مسلسل/أنمي)" required>
            
            <select id="cinema-lang-select" style="display: none;">
                <option value="en">فيلم أجنبي 🌍</option>
                <option value="ar">فيلم عربي 🇪🇬</option>
            </select>

            <select id="new-item-status">
                <option value="completed">اكتمل المشاهدة (✓)</option>
                <option value="dropped">لم يكتمل (✗)</option>
            </select>
            <input type="text" id="new-item-stopped" placeholder="وقفت فين؟ (مثال: الموسم التاني)" style="display:none;">
            <input type="number" id="new-item-rating" min="0" max="10" step="0.5" placeholder="تقييمك (من 10)">
            <button onclick="addNewItem()">إضافة وبحث تلقائي 🔍</button>
        </div>
    </div>

    <!-- شريط عرض إجمالي العدد في القسم الحالي -->
    <div class="section-stats-wrapper">
        <div id="section-counter-banner" class="section-counter-banner">
            <span id="banner-title">إجمالي مسلسلات عربي:</span>
            <span id="banner-count" class="count-number">0</span>
        </div>
    </div>

    <main id="app-container">
        <!-- الكروت هتتعرض هنا -->
    </main>

    <script src="script.js"></script>
</body>
</html>
